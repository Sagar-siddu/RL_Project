[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dynamic-pricing-env"
version = "1.0.0"
description = "Dynamic E-Commerce Pricing Optimization — OpenEnv Environment"
requires-python = ">=3.10"
dependencies = [
    "openenv-core>=0.2.1",
    "fastapi>=0.110.0",
    "uvicorn[standard]>=0.29.0",
    "pydantic>=2.0.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[tool.hatch.build.targets.wheel]
packages = ["dynamic_pricing_env"]

[tool.uv.scripts]
server = "uvicorn server.app:app --host 0.0.0.0 --port 7860 --reload"
